plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

repositories {
    mavenCentral()
}

dependencies {

    // ============================================================
    // VB-DIM-Reader
    // ============================================================
    implementation files('libs/VB-DIM-Reader-2.1.0.jar')

    // Dependencias utilizadas por VB-DIM-Reader
    implementation 'org.json:json:20240303'
    implementation 'commons-io:commons-io:2.11.0'
    implementation 'org.slf4j:slf4j-api:1.7.32'
    implementation 'at.favre.lib:bytes:1.5.0'
}

javafx {
    version = '21.0.4'

    modules = [
            'javafx.controls',
            'javafx.graphics'
    ]
}

application {
    mainClass = 'org.example.Main'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

// Los .java están en UTF-8 (tildes, ñ, "…"). Sin esto, en Windows javac los
// lee como windows-1252: falla con algunos caracteres y corrompe los textos
// en español (incluido el prompt que se le manda a la IA).
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// ============================================================
// VS Online -- Fase 1 (esqueleto de red)
//   .\gradlew.bat runServer                         servidor en el puerto 7777
//   .\gradlew.bat runClient --args="--ventanas=2"   dos jugadores de prueba
// ============================================================
tasks.register('runServer', JavaExec) {
    group = 'vs online'
    description = 'Arranca el servidor VS Online en esta PC.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.example.online.server.VsServer'
    jvmArgs '-Dfile.encoding=UTF-8'
    standardInput = System.in
}

tasks.register('runClient', JavaExec) {
    group = 'vs online'
    description = 'Abre la ventana de prueba de la sala (acepta --host, --port, --name, --ventanas).'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.example.online.client.LobbyTestLauncher'
    jvmArgs '-Dfile.encoding=UTF-8'
}
// ============================================================
// Paquetes listos para compartir (jpackage, Java incluido), mismo código:
//   0.0.3.1  -- la de los PROBADORES: sin asistente ni chat IA
//              (-Ddigimon.edicion=tester).            .\gradlew.bat packageTester
//   .\gradlew.bat runTester    prueba la 0.0.3.1 desde el código
// Queda en ..\DIGIMON-ASSISTANT <versión>\ (carpeta + .zip).
// El servidor viene como "100.x" (decisión del usuario): cada probador escribe
// la IP que le pase el anfitrión; si no escribe una válida, el juego arranca igual
// (funciones locales) y la sala avisa que no pudo conectar.
// ============================================================
def testerHost = '100.x'

tasks.register('runTester', JavaExec) {
    group = 'vs online'
    description = 'Arranca la edición 0.0.3.1 (sin asistente ni chat IA).'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.example.Launcher'
    jvmArgs '-Dfile.encoding=UTF-8', '-Ddigimon.edicion=tester', "-Ddigimon.servidor=${testerHost}"
}

// El jar de 0.0.3.1 NO lleva la pestaña ACCESO (exclusiva del anfitrión, decisión del usuario).
tasks.register('testerJar', Jar) {
    archiveClassifier = 'tester'
    from sourceSets.main.output
    exclude 'org/example/lab/AccessTab*'
    manifest { attributes 'Main-Class': 'org.example.Launcher' }
}

tasks.register('testerInput', Sync) {
    dependsOn 'testerJar'
    from tasks.named('testerJar')
    from configurations.runtimeClasspath
    into layout.buildDirectory.dir('package/tester-input')
}

/** Arma una edición: app-image con jpackage, copia a ..\<outFolder>\ y un .zip. */
def buildPackage = { String appName, String outFolder, List<String> javaOptions, File readme,
                     File input, String mainJar, boolean withServer ->
    def jdk = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(17) }.get().metadata.installationPath
    def jpackage = jdk.file('bin/jpackage.exe').asFile
    def work = layout.buildDirectory.dir("package/${appName}").get().asFile
    def image = new File(work, 'image')
    ant.delete(dir: image, failonerror: false)
    work.mkdirs()

    def cmd = [jpackage.absolutePath, '--type', 'app-image',
               '--name', appName,
               '--input', input,
               '--main-jar', mainJar,
               '--main-class', 'org.example.Launcher',
               '--java-options', '-Dfile.encoding=UTF-8']
    javaOptions.each { cmd += ['--java-options', it] }
    if (withServer) {
        // Segundo ejecutable: el servidor, con consola (apagar / jugadores / expulsar).
        def serverProps = new File(work, 'servidor.properties')
        serverProps.text = 'main-class=org.example.online.server.VsServer\n' +
                'win-console=true\n' +
                'java-options=-Dfile.encoding=UTF-8\n'
        cmd += ['--add-launcher', "Servidor VS Online=${serverProps}"]
    }
    cmd += ['--app-version', '0.0.3', '--vendor', 'Digimon Project', '--dest', image]
    def proc = new ProcessBuilder(cmd.collect { it.toString() }).inheritIO().start()
    if (proc.waitFor() != 0) throw new GradleException("jpackage falló (código ${proc.exitValue()})")

    def out = file("${projectDir}/../${outFolder}")
    out.mkdirs()
    ant.delete(dir: new File(out, appName), failonerror: false)
    ant.delete(file: new File(out, "${appName}.zip"), failonerror: false)
    ant.copy(todir: out) { fileset(dir: image) }
    ant.copy(file: readme, todir: out)
    ant.copy(file: file("LICENSE"), todir: out)
    ant.copy(file: file("THIRD-PARTY-NOTICES.md"), todir: out)
    ant.zip(destfile: new File(out, "${appName}.zip")) {
        fileset(dir: image)
        fileset(file: readme)
        fileset(file: file("LICENSE"))
        fileset(file: file("THIRD-PARTY-NOTICES.md"))
    }
    println "Listo: ${out}"
}

tasks.register('packageTester') {
    group = 'vs online'
    description = 'Arma 0.0.3.1 para probadores: carpeta con Java incluido y un .zip listo para compartir.'
    dependsOn 'testerInput'
    doLast {
        buildPackage('DigimonVS-0.0.3.1', 'DIGIMON-ASSISTANT 0.0.3.1',
                ['-Ddigimon.edicion=tester', "-Ddigimon.servidor=${testerHost}".toString()], file('tester/LEEME.txt'),
                layout.buildDirectory.dir('package/tester-input').get().asFile,
                tasks.named('testerJar').get().archiveFileName.get(), false)
    }
}

